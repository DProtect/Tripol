name: QUANTUM X benchmarks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: v0.26.0
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: v0.27.0
          path: baseline027
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current and baseline compilers
        run: |
          go build -trimpath -o "$RUNNER_TEMP/tripol027" .
          (cd baseline && go build -trimpath -o "$RUNNER_TEMP/tripol026" .)
          (cd baseline027 && go build -trimpath -o "$RUNNER_TEMP/tripol0270" .)
          "$RUNNER_TEMP/tripol026" --version
          "$RUNNER_TEMP/tripol0270" --version
          "$RUNNER_TEMP/tripol027" --version
      - name: Reproduce old/new and cross-language measurements
        env:
          TRIPOL_NO_UPDATE: '1'
        run: |
          mkdir -p benchmark-results
          python benchmarks/compare_versions.py --old "$RUNNER_TEMP/tripol026" --new "$RUNNER_TEMP/tripol027" --runs 7 --out benchmark-results/compare.json
          python benchmarks/compare_versions.py --old "$RUNNER_TEMP/tripol0270" --new "$RUNNER_TEMP/tripol027" --runs 7 --out benchmark-results/compare-0.27.0.json
          python benchmarks/quantum_x.py --compiler "$RUNNER_TEMP/tripol027" \
            --baseline "0.26.0=$RUNNER_TEMP/tripol026" --baseline "0.27.0=$RUNNER_TEMP/tripol0270" \
            --runs 7 --out benchmark-results/languages.json
      - name: Measure compiler validation and stage breakdown
        shell: bash
        run: |
          set -o pipefail
          go test ./core -run '^$' -bench BenchmarkValidationBuffer -benchmem -count=3 | tee benchmark-results/compiler-validation.txt
          "$RUNNER_TEMP/tripol027" compile-report examples/academy/simple-r1.tri --profile turbo --target linux --json > benchmark-results/compiler-stages.json
          go test -count=1 ./core ./tests
          go test -race ./core -run '^TestCFGParallelDeterminism$' -count=1
          go test ./core -run '^$' -bench '^BenchmarkLinkLiterals$' -benchmem -count=3 | tee benchmark-results/link-literals.txt
          go test ./core -run '^$' -bench '^BenchmarkCFGWorkers$' -benchmem -count=3 | tee benchmark-results/cfg-workers.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-x-measurements
          path: benchmark-results/
  http:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      TRIPOL_NO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build six HTTP benchmark clients
        shell: bash
        run: |
          go build -trimpath -o tripol-bench.exe .
          cd benchmarks/http_r2
          python -m venv .venv
          if [[ "$RUNNER_OS" == Windows ]]; then
            worker_python=.venv/Scripts/python.exe
            target=windows
          else
            worker_python=.venv/bin/python
            target=linux
          fi
          "$worker_python" -m pip install -r requirements.txt
          cargo build --manifest-path reqwest/Cargo.toml --release --locked
          ../../tripol-bench.exe build tripol.tri --target "$target" --profile turbo -o tripol-http.exe
          go build -trimpath -ldflags='-s -w' -o go-http.exe net_http.go
      - name: Exercise sequential, concurrent and streaming profiles
        working-directory: benchmarks/http_r2
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/http-results"
          launcher=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            worker_python=.venv/Scripts/python.exe
            rust=reqwest/target/release/tripol-http-fixture.exe
            launcher=(--launcher ../../tripol-bench.exe)
          else
            worker_python=.venv/bin/python
            rust=reqwest/target/release/tripol-http-fixture
          fi
          for mode in sequential concurrent stream; do
            "$worker_python" run.py --mode "$mode" --runs 7 --python "$worker_python" \
              --tripol ./tripol-http.exe --go ./go-http.exe --rust "$rust" "${launcher[@]}" \
              > "$RUNNER_TEMP/http-results/$mode.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dipo-http-2-measurements-${{ runner.os }}
          path: ${{ runner.temp }}/http-results/
