name: Public ecosystem
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Prepare the experimental v0.28.0 draft release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  history-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable history (redacted)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --log-opts="--all" --redact=100 --no-banner
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test
        run: |
          go test -count=1 ./...
          go vet ./...
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o tripol .
          ./tripol --version
          ./tripol build examples/projects/expense_report.tri --target linux -o expense
          ./expense | tee /tmp/expense.txt
          grep -q '46000' /tmp/expense.txt
          ./tripol build examples/projects/notes.tri --target linux -o /tmp/tripol-notes
          scratch=$(mktemp -d)
          (cd "$scratch"; printf 'Test note\n' | /tmp/tripol-notes; grep -q 'Test note' notes.txt)
          tar -czf dist/TRIPOL-v0.28-Linux-x64.tar.gz tripol LICENSE -C core discord-websocket-LICENSE.txt
      - name: Package editor extension
        run: |
          cp LICENSE vscode/LICENSE
          cd vscode
          node generate-catalog.js
          node --check extension.js
          npx --yes @vscode/vsce@3 package --no-dependencies --out ../dist/tripol-language-0.28.0.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: linux-and-editor
          path: dist/
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Build and test unsigned installer
        shell: pwsh
        run: |
          go test -count=1 ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force installer/payload, dist | Out-Null
          Copy-Item examples/hello.tri installer/payload/hello.tri
          $env:CGO_ENABLED = '0'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags '-s -w' -o installer/payload/tripol.exe .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item installer/payload/tripol.exe dist/TRIPOL-v0.28-Windows-x64.exe
          go build -trimpath -ldflags '-s -w' -o dist/TRIPOL-v0.28-Setup-x64.exe ./installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./dist/TRIPOL-v0.28-Setup-x64.exe --quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $compiler = Join-Path $env:LOCALAPPDATA 'Programs/TRIPOL/tripol.exe'
          & $compiler --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $compiler build examples/projects/expense_report.tri --target windows -o expense.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $output = & ./expense.exe
          if ($LASTEXITCODE -or ($output -join ' ') -notmatch '46000') { throw 'Expense smoke test failed' }
          & $compiler build examples/projects/notes.tri --target windows -o notes.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $compiler build examples/discord_new.tri --target windows -o discord-preview.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $preview = & ./discord-preview.exe
          if ($LASTEXITCODE -or $preview.Count -ne 2) { throw 'Discord offline example failed' }
          $payload = $preview[1] | ConvertFrom-Json
          if ($payload.embeds[0].color -ne 41215 -or $payload.embeds[0].fields[0].value -ne '0.28.0') { throw 'Discord embed payload mismatch' }
          & ./tests/manual/test-v027.ps1 -Compiler $compiler -ExpectedVersion 0.28.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./dist/TRIPOL-v0.28-Setup-x64.exe --quiet --uninstall
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/TRIPOL-v0.28-Setup-x64.exe, LICENSE -DestinationPath dist/TRIPOL-v0.28-Installer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.create_draft
    needs: [history-audit, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          artifacts=(TRIPOL-v0.28-Windows-x64.exe TRIPOL-v0.28-Setup-x64.exe TRIPOL-v0.28-Installer.zip TRIPOL-v0.28-Linux-x64.tar.gz tripol-language-0.28.0.vsix)
          sha256sum "${artifacts[@]}" > SHA256SUMS.txt
          if gh release view v0.28.0 >/dev/null 2>&1; then echo 'Release or draft already exists'; exit 0; fi
          gh release create v0.28.0 --target "$GITHUB_SHA" --draft --prerelease --title "TRIPOL v0.28.0 — DISCORD REVOLUTION" --notes "Experimental preview. Review the validation evidence and SHA256SUMS.txt before publishing. The Windows installer is unsigned." "${artifacts[@]}" SHA256SUMS.txt
