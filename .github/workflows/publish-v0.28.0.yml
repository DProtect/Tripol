name: Publish DISCORD REVOLUTION v0.28.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.28.0.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release-v0.28.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: e635e7d26e6b347cb216e1476bffc193179c6236
      RUN_ID: '46108293979'
    steps:
      - name: Verify successful CI and exact source
        shell: bash
        run: |
          set -euo pipefail
          for run in "$RUN_ID" 46108293954 46108293996 46108294053; do
            gh api "repos/$GH_REPO/actions/runs/$run" --jq '[.head_sha,.conclusion]|@tsv' | grep -Fx "$(printf '%s\tsuccess' "$SOURCE_SHA")"
          done
      - name: Fetch verified build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" -n windows -D dist
          gh run download "$RUN_ID" -n linux-and-editor -D dist
          cd dist
          sha256sum TRIPOL-v0.28-Windows-x64.exe TRIPOL-v0.28-Setup-x64.exe TRIPOL-v0.28-Installer.zip TRIPOL-v0.28-Linux-x64.tar.gz tripol-language-0.28.0.vsix > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish experimental release without replacing existing assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.28.0 --json tagName >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.'
            exit 1
          fi
          cd dist
          cat > release-notes.md <<'EOF'
          ## DISCORD REVOLUTION & SIMPLE R2
          Experimental preview for Windows and Linux x86-64.
          
          - Contextual type inference, implicit final-expression returns, inline callbacks and static overload resolution.
          - Slash commands, context menus, embeds, Components V2, emojis, modals, cooldowns, permissions, moderation and server resources.
          - Shared launcher transport with Resume, reconnect, zlib-stream, rate limits and multipart support.
          - 64 libraries; catalog: 449 functions and 196 methods (645 entries), including 98 functions and 196 methods for Discord.
          - All four CI workflows passed on the exact source commit.
          
          Discord networking is experimental: local tests are not prolonged live validation. Windows advanced transport requires the TRIPOL launcher. Voice and advanced sharding are deferred. Channel lock recovery after launcher restart remains pending. Local SDK benchmarks do not establish connected-bot performance.
          
          The Windows installer is unsigned. Verify SHA256SUMS.txt before installation.
          
          [Documentation](https://tripollas.github.io/Tripol/docs/) · [Validation guide](https://github.com/Tripollas/Tripol/blob/e635e7d26e6b347cb216e1476bffc193179c6236/docs/discord-validation.md) · [Benchmarks](https://github.com/Tripollas/Tripol/tree/e635e7d26e6b347cb216e1476bffc193179c6236/benchmarks/discord_sdks)
          EOF
          gh release create v0.28.0 --target "$SOURCE_SHA" --prerelease --title 'TRIPOL v0.28.0 — DISCORD REVOLUTION' --notes-file release-notes.md TRIPOL-v0.28-Windows-x64.exe TRIPOL-v0.28-Setup-x64.exe TRIPOL-v0.28-Installer.zip TRIPOL-v0.28-Linux-x64.tar.gz tripol-language-0.28.0.vsix SHA256SUMS.txt
