name: TRIPOL Web Engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'stdlib/**'
      - 'cmd/tripol-web/**'
      - '.github/workflows/web-engine.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: tripol-web-engine
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./core -run TestWebEngineR1 -count=1
      - name: Build browser compiler
        run: |
          mkdir -p web-dist
          GOOS=js GOARCH=wasm go build -trimpath -o web-dist/tripol-compiler.wasm ./cmd/tripol-web
          goroot="$(go env GOROOT)"
          if [ -f "$goroot/lib/wasm/wasm_exec.js" ]; then
            cp "$goroot/lib/wasm/wasm_exec.js" web-dist/wasm_exec.js
          else
            cp "$goroot/misc/wasm/wasm_exec.js" web-dist/wasm_exec.js
          fi
          cp cmd/tripol-web/host-r3.js web-dist/host-r3.js
          test -s web-dist/wasm_exec.js
          test -s web-dist/tripol-compiler.wasm
      - name: Test real compiler and generated WebAssembly
        run: |
          cp cmd/tripol-web/test-r3.cjs web-dist/test-r3.cjs
          go build -trimpath -o web-dist/tripol-native .
          git fetch origin gh-pages
          git show origin/gh-pages:playground/examples-r3.js > web-dist/examples-r3.js
          node --experimental-global-webcrypto web-dist/test-r3.cjs web-dist/examples-r3.js "$(pwd)/web-dist/tripol-native"
          rm web-dist/tripol-native web-dist/examples-r3.js web-dist/test-r3.cjs
      - name: Mark verified engine
        run: |
          printf '{"verified":true,"abi":3,"commit":"%s"}\n' "$GITHUB_SHA" > web-dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: tripol-web-engine
          path: web-dist/
      - name: Publish compiler assets to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add --detach /tmp/tripol-pages origin/gh-pages
          mkdir -p /tmp/tripol-pages/playground/engine-r3
          cp web-dist/* /tmp/tripol-pages/playground/engine-r3/
          cd /tmp/tripol-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playground/engine-r3
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified TRIPOL Web Engine R3"
            git push origin HEAD:gh-pages
          fi
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild must be requested manually if branch deployment is not triggered"
