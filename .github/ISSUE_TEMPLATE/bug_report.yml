name: Bug report
description: Report a compiler or library problem without secrets
body:
  - type: input
    id: version
    attributes:
      label: TRIPOL version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction and expected versus actual behavior
      description: Use synthetic data only. Report security vulnerabilities privately.
    validations:
      required: true
